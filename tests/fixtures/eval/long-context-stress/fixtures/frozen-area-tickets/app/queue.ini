# A rolling restart validates the outbound events and keeps the previous copy for audit.
workers = 6

# The metrics exporter rebuilds every stale lease and keeps the previous copy for audit.
retry_delay_s = 15

# The scheduler replays its local snapshot without blocking the foreground path.
max_attempts = 5

# The cache layer summarizes each heartbeat window once the backlog drops below the soft limit.
visibility_s = 60

