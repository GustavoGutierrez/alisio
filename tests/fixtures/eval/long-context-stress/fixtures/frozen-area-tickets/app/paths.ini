# A rolling restart reconciles the session table unless an operator pins the revision.
spool_dir = /var/spool/app

# The config loader throttles the overflow buffer so later stages see a consistent view.
log_dir = /var/log/app

# A retry loop indexes the overflow buffer once the backlog drops below the soft limit.
tmp_dir = /tmp/app

# The cache layer summarizes a shard manifest once the backlog drops below the soft limit.
data_dir = /srv/app/data

