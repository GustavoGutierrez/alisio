name: Desktop release

# One GitHub Release per version: the `vX.Y.Z` tag gets a release titled "Alisio X.Y.Z" with the
# CHANGELOG notes, the Alisio Desktop installers for every OS and their checksums. A stable version is
# marked "Latest". The tag version must match apps/desktop/package.json (all packages share it).
#
# Release flow: develop is merged into main. A push to main whose apps/desktop/package.json version has
# no `vX.Y.Z` tag yet creates that tag and its release; a push whose version is already tagged does nothing.
# Pushing a `vX.Y.Z` tag by hand (or workflow_dispatch) still builds and publishes that tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.11.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: Resolve the release tag
        id: tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            tag="v$(node -p "require('./apps/desktop/package.json').version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged: nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            tag="${{ github.event.inputs.tag || github.ref_name }}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Check the tag against apps/desktop/package.json
        id: meta
        if: steps.tag.outputs.skip != 'true'
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Tag $TAG must look like vX.Y.Z"; exit 1 ;; esac
          version="${TAG#v}"
          actual="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$version" != "$actual" ]; then
            echo "Tag version $version does not match apps/desktop/package.json version $actual"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or complete the release
        if: steps.tag.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The version's CHANGELOG section, without its heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > changelog.md
          cat > desktop.md <<NOTES
          <!-- alisio-desktop-installers -->
          ## Alisio Desktop

          Pick the file for your system under Assets: \`Alisio-Setup-$VERSION-x64.exe\` (Windows 10/11),
          \`Alisio-$VERSION-arm64.dmg\` (Mac with Apple silicon), \`Alisio-$VERSION-x64.dmg\` (Intel Mac),
          \`Alisio-$VERSION-x86_64.AppImage\` or \`Alisio-$VERSION-amd64.deb\` (Linux). The terminal and
          browser UI install from npm: \`npm install -g @alisio/alisio-code@$VERSION\`.

          ### These builds are not code-signed

          - **Windows (SmartScreen):** when "Windows protected your PC" appears, choose **More info**, then **Run anyway**.
          - **macOS (Gatekeeper):** the app is ad-hoc signed, not notarized. If macOS refuses to open it, go to
            **System Settings**, then **Privacy & Security**, and choose **Open Anyway**, or run
            \`xattr -cr /Applications/Alisio.app\` in a terminal once.
          - **Linux:** make the AppImage executable (\`chmod +x\`) and run it, or install the \`.deb\`.

          Verify your download with \`SHA256SUMS-desktop.txt\`, attached to this release once every build has finished
          (\`sha256sum -c SHA256SUMS-desktop.txt --ignore-missing\`).

          Full guide: https://gustavogutierrez.github.io/alisio/desktop
          NOTES
          case "$VERSION" in
            *-*) flags=(--prerelease --latest=false) ;;
            *) flags=(--latest) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created by hand first: keep its notes, add the installer section once, fix the title.
            gh release view "$TAG" --json body --jq .body > notes.md
            if ! grep -q "alisio-desktop-installers" notes.md; then
              printf '\n\n' >> notes.md
              cat desktop.md >> notes.md
            fi
            gh release edit "$TAG" --title "Alisio $VERSION" --notes-file notes.md "${flags[@]}"
          else
            { cat changelog.md; printf '\n'; cat desktop.md; } > notes.md
            # On a push to main the tag does not exist yet: create it on this commit.
            if [ "$GITHUB_REF_TYPE" = "branch" ]; then target=(--target "$GITHUB_SHA"); else target=(--verify-tag); fi
            gh release create "$TAG" "${target[@]}" --title "Alisio $VERSION" --notes-file notes.md "${flags[@]}"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            builder_args: "--linux"
            assets: "apps/desktop/release/*.AppImage apps/desktop/release/*.deb"
          - os: windows-latest
            builder_args: "--win"
            assets: "apps/desktop/release/*.exe"
          - os: macos-latest
            builder_args: "--mac --arm64 --x64"
            assets: "apps/desktop/release/*.dmg"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-builder downloads its own Electron zip, but pnpm may skip the electron package's
      # postinstall; this makes the binary available either way (a no-op when it is present).
      - name: Ensure the Electron binary is installed
        shell: bash
        run: node -e "const p=require('path'),f=require('fs');const d=p.dirname(require.resolve('electron/package.json',{paths:['apps/desktop']}));if(!f.existsSync(p.join(d,'path.txt')))require('child_process').execFileSync(process.execPath,[p.join(d,'install.js')],{stdio:'inherit'})"
      # The whole repository build: the desktop runtime ships the dist trees and the web UI build.
      - run: pnpm build
      - run: pnpm --filter @alisio/desktop run build
      - run: pnpm --filter @alisio/desktop run prepare:runtime
      - name: Package the installers
        run: pnpm --filter @alisio/desktop exec electron-builder --config electron-builder.config.mjs ${{ matrix.builder_args }} --publish never
      - name: Upload the installers to the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(${{ matrix.assets }})
          if [ "${#files[@]}" -eq 0 ]; then echo "No installers were produced"; exit 1; fi
          ls -l "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  checksums:
    name: Checksums
    needs: [release, build]
    if: needs.release.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Download the installers and publish SHA256SUMS-desktop.txt
        run: |
          mkdir assets
          cd assets
          for pattern in '*.exe' '*.dmg' '*.AppImage' '*.deb'; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pattern"
          done
          sha256sum -- * | sort -k2 > ../SHA256SUMS-desktop.txt
          cd ..
          cat SHA256SUMS-desktop.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" SHA256SUMS-desktop.txt --clobber
